<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0d0d0d;
    color: #f0ece4;
    font-family: 'DM Sans', sans-serif;
  }
  .card {
    position: relative;
    width: 1200px; height: 630px;
    padding: 0 90px;
    display: flex; align-items: center;
    overflow: hidden;
  }
  .glow {
    position: absolute; top: -220px; right: -160px;
    width: 780px; height: 780px;
    background: radial-gradient(circle, rgba(201,168,76,0.14) 0%, transparent 70%);
  }
  .row { position: relative; z-index: 1; display: flex; align-items: center; gap: 64px; width: 100%; }
  .avatar-wrap {
    width: 260px; height: 320px; border-radius: 2px; flex-shrink: 0;
    border: 1px solid #2a2a2a; overflow: hidden;
    box-shadow: 0 0 70px rgba(201,168,76,0.1);
  }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(20%); }
  .text { display: flex; flex-direction: column; gap: 22px; }
  .kicker {
    font-size: 19px; letter-spacing: 0.25em; text-transform: uppercase;
    color: #c9a84c; display: flex; align-items: center; gap: 14px;
  }
  .kicker::before { content: ''; width: 46px; height: 2px; background: #c9a84c; }
  h1 { font-family: 'Cormorant', serif; font-weight: 600; font-size: 60px; letter-spacing: 0.02em; }
  .sub { font-size: 21px; color: #b8b0a4; max-width: 620px; line-height: 1.55; }
  .domain { font-size: 16px; color: #7a7570; letter-spacing: 0.08em; margin-top: 6px; }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="row">
      <div class="avatar-wrap"><img src="yo.jpeg" /></div>
      <div class="text">
        <div class="kicker">CTO · DevOps · SRE</div>
        <h1>Abel Aníbal Cáceres</h1>
        <p class="sub">Ejecutivo tecnológico impulsando IA, infraestructura cloud y transformación digital crítica en banca y salud.</p>
        <div class="domain">abelanibalcaceres.site</div>
      </div>
    </div>
  </div>
</body>
</html>
