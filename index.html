<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abel Aníbal Cáceres</title>
<meta name="description" content="Abel Aníbal Cáceres — CTO | Sysadmin · DevOps · SRE. Más de 15 años construyendo infraestructuras sólidas, escalables y automatizadas." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --border: #2a2a2a;
  --accent: #c9a84c;
  --accent-dim: rgba(201, 168, 76, 0.12);
  --text: #f0ece4;
  --text-muted: #7a7570;
  --text-soft: #b8b0a4;
  --radius: 4px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  line-height: 1.7;
  cursor: none;
}

/* Cursor */
.cursor {
  position: fixed; width: 10px; height: 10px;
  background: var(--accent); border-radius: 50%;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%, -50%);
  transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease;
}
.cursor-ring {
  position: fixed; width: 36px; height: 36px;
  border: 1px solid rgba(201,168,76,0.4); border-radius: 50%;
  pointer-events: none; z-index: 9998;
  transform: translate(-50%, -50%);
  transition: all 0.15s ease;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Layout */
.container { max-width: 900px; margin: 0 auto; padding: 0 2rem; }

/* Nav */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 1.5rem 2rem;
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(to bottom, rgba(13,13,13,0.95), transparent);
  backdrop-filter: blur(8px);
}
.nav-logo {
  font-family: 'Cormorant', serif; font-size: 1.1rem;
  color: var(--accent); letter-spacing: 0.05em; text-decoration: none;
}
.nav-links { display: flex; gap: 2rem; list-style: none; }
.nav-links a {
  color: var(--text-muted); text-decoration: none;
  font-size: 0.78rem; letter-spacing: 0.15em;
  text-transform: uppercase; transition: color 0.3s;
}
.nav-links a:hover { color: var(--accent); }

/* Language Switch */
.lang-switch {
  display: flex; align-items: center; gap: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 6px;
  cursor: none; position: relative;
  transition: border-color 0.3s;
}
.lang-switch:hover { border-color: var(--accent); }
.lang-option {
  font-size: 0.68rem; font-weight: 500;
  letter-spacing: 0.1em; padding: 3px 8px;
  border-radius: 14px; z-index: 1; position: relative;
  transition: color 0.3s;
  color: var(--text-muted);
}
.lang-switch.lang-es .lang-option:first-child,
.lang-switch.lang-en .lang-option:last-child {
  color: #0d0d0d;
}
.lang-slider {
  position: absolute;
  width: 34px; height: 26px;
  background: var(--accent); border-radius: 14px;
  transition: left 0.3s cubic-bezier(0.22,1,0.36,1);
  top: 50%; transform: translateY(-50%);
}
.lang-switch.lang-es .lang-slider { left: 5px; }
.lang-switch.lang-en .lang-slider { left: calc(100% - 39px); }

/* Hero */
.hero {
  min-height: auto;
  padding: 8rem 2rem 3rem;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; top: -20%; right: -10%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
  pointer-events: none;
}
.hero-inner {
  max-width: 900px; margin: 0 auto; width: 100%;
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; gap: 4rem;
}
.hero-tag {
  font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 1.5rem;
  display: flex; align-items: center; gap: 0.75rem;
  animation: heroFadeUp 0.8s cubic-bezier(0.22,1,0.36,1) 0.2s both;
}
.hero-tag::before { content: ''; width: 30px; height: 1px; background: var(--accent); }
.hero h1 {
  font-family: 'Cormorant', sans-serif;
  font-size: clamp(2rem, 4vw, 3.4rem);
  font-weight: 300; line-height: 1.1;
  margin-bottom: 1.5rem; letter-spacing: 0.08em;
  animation: heroFadeUp 0.8s cubic-bezier(0.22,1,0.36,1) 0.35s both;
}
.hero-desc {
  color: var(--text-soft); font-size: 1.05rem;
  max-width: 460px; margin-bottom: 2.5rem;
  animation: heroFadeUp 0.8s cubic-bezier(0.22,1,0.36,1) 0.5s both;
}
.hero-ctas {
  display: flex; gap: 1rem; flex-wrap: wrap;
  animation: heroFadeUp 0.8s cubic-bezier(0.22,1,0.36,1) 0.65s both;
}
.hero-photo-wrap {
  animation: heroFadeUp 0.8s cubic-bezier(0.22,1,0.36,1) 0.4s both;
}
@keyframes heroFadeUp {
  from { opacity: 0; transform: translateY(36px); }
  to   { opacity: 1; transform: translateY(0); }
}

.btn-primary {
  background: var(--accent); color: #0d0d0d;
  padding: 0.75rem 1.75rem; font-size: 0.82rem; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  border: none; border-radius: var(--radius);
  text-decoration: none; cursor: none;
  transition: opacity 0.2s, transform 0.2s;
  display: inline-block;
}
.btn-primary:hover { opacity: 0.85; transform: translateY(-2px); }

.btn-secondary {
  background: transparent; color: var(--text-soft);
  padding: 0.75rem 1.75rem; font-size: 0.82rem; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  border: 1px solid var(--border); border-radius: var(--radius);
  text-decoration: none; cursor: none;
  transition: border-color 0.2s, color 0.2s, transform 0.2s;
  display: inline-block;
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

.hero-photo {
  width: 220px; height: 280px; border-radius: 2px; object-fit: cover;
  filter: grayscale(20%); border: 1px solid var(--border);
  box-shadow: 0 0 60px rgba(201,168,76,0.08);
  -webkit-mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, black 60%, transparent 100%);
  mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, black 40%, transparent 100%);
}

/* Mission */
.mission-lead {
  font-family: 'Cormorant', serif; font-weight: 500; font-style: italic;
  font-size: clamp(1.35rem, 2.2vw, 1.9rem); line-height: 1.55;
  color: var(--text); max-width: 760px; margin-bottom: 2rem;
  border-left: 2px solid var(--accent); padding-left: 1.5rem;
}
.mission-body { font-size: 1rem; color: var(--text-soft); line-height: 1.9; max-width: 760px; }
.mission-body p + p { margin-top: 1.25rem; }

/* Sections */
section { padding: 6rem 2rem; }
.section-label {
  font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 3rem;
  display: flex; align-items: center; gap: 1rem;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* Fade-in on scroll */
.fade-in {
  opacity: 0; transform: translateY(28px);
  transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22,1,0.36,1);
}
.fade-in.visible { opacity: 1; transform: translateY(0); }

/* About */
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start; }
.about-text { font-size: 1rem; color: var(--text-soft); line-height: 1.9; }
.about-text p + p { margin-top: 1.25rem; }
.about-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.stat-item {
  background: var(--surface); border: 1px solid var(--border);
  padding: 1.5rem; border-radius: var(--radius); transition: border-color 0.3s;
}
.stat-item:hover { border-color: var(--accent); }
.stat-number {
  font-family: 'Cormorant', serif; font-size: 2.2rem; font-weight: 600;
  color: var(--accent); line-height: 1; margin-bottom: 0.4rem;
}
.stat-label { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }

/* Timeline */
.timeline { position: relative; padding-left: 2rem; }
.timeline::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 0;
  width: 1px; background: var(--border);
}
.timeline-item { position: relative; margin-bottom: 3rem; }
.timeline-item::before {
  content: ''; position: absolute; left: -2rem; top: 8px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); transform: translateX(-3px);
}
.timeline-date { font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.4rem; }
.timeline-title { font-family: 'Cormorant', serif; font-size: 1.2rem; font-weight: 600; margin-bottom: 0.25rem; }
.timeline-company { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem; }
.timeline-desc { font-size: 0.92rem; color: var(--text-soft); line-height: 1.8; }

/* Case Studies */
.case-studies { display: flex; flex-direction: column; gap: 2rem; }
.case-study {
  background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  padding: 2rem 2.25rem; border-radius: var(--radius); transition: border-color 0.3s, transform 0.3s;
}
.case-study:hover { border-color: var(--accent); transform: translateY(-3px); }
.case-study-header {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
  gap: 0.75rem; margin-bottom: 1rem;
}
.case-study-title { font-family: 'Cormorant', serif; font-size: 1.4rem; font-weight: 600; line-height: 1.3; max-width: 640px; }
.case-study-period { font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.case-study-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }
.case-study-tag {
  font-size: 0.72rem; color: var(--text-muted);
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  padding: 0.25rem 0.65rem; border-radius: 2px;
}
.case-study-body { font-size: 0.96rem; color: var(--text-soft); line-height: 1.85; }

/* Speaking */
.speaking-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
.speaking-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; transition: border-color 0.3s, transform 0.3s;
  display: flex; flex-direction: column;
}
.speaking-card:hover { border-color: var(--accent); transform: translateY(-3px); }
.speaking-photo { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; filter: grayscale(15%); display: block; }
.speaking-content { padding: 1.5rem 1.75rem; display: flex; flex-direction: column; gap: 0.6rem; }
.speaking-title { font-family: 'Cormorant', serif; font-size: 1.15rem; font-weight: 600; }
.speaking-tag { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.speaking-body { font-size: 0.86rem; color: var(--text-soft); line-height: 1.75; }

/* Projects */
.projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
.project-card {
  background: var(--surface); border: 1px solid var(--border);
  padding: 1.75rem; border-radius: var(--radius);
  transition: border-color 0.3s, transform 0.3s;
  display: flex; flex-direction: column; gap: 1rem;
}
.project-card:hover { border-color: var(--accent); transform: translateY(-3px); }
.project-logo { height: 84px; display: flex; align-items: center; }
.project-logo img { height: 80px; width: auto; object-fit: contain; }
.project-name { font-family: 'Cormorant', serif; font-size: 1.25rem; font-weight: 600; }
.project-role { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-top: 0.2rem; }
.project-desc { font-size: 0.88rem; color: var(--text-soft); line-height: 1.75; flex: 1; }
.project-link {
  font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-soft); text-decoration: none;
  display: inline-flex; align-items: center; gap: 0.5rem;
  transition: color 0.2s; padding-top: 0.5rem; border-top: 1px solid var(--border);
}
.project-link:hover { color: var(--accent); }
.project-link svg { flex-shrink: 0; }

/* Skills */
.skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
.skill-group {
  background: var(--surface); border: 1px solid var(--border);
  padding: 1.75rem; border-radius: var(--radius);
  transition: border-color 0.3s, transform 0.3s;
}
.skill-group:hover { border-color: var(--accent); transform: translateY(-3px); }
.skill-group-title { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; }
.skill-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.skill-tag {
  font-size: 0.8rem; color: var(--text-soft);
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  padding: 0.3rem 0.75rem; border-radius: 2px;
}

/* Certifications */
.cert-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.75rem; }
.cert-item {
  font-size: 0.88rem; color: var(--text-soft);
  padding: 0.75rem 1rem; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; align-items: center; gap: 0.6rem; transition: border-color 0.3s;
}
.cert-item:hover { border-color: var(--accent); }
.cert-dot { color: var(--accent); font-size: 0.7rem; flex-shrink: 0; }

/* Languages section */
.lang-list { display: flex; flex-direction: column; gap: 2rem; max-width: 560px; }
.lang-header {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 0.6rem;
}
.lang-name { font-family: 'Cormorant', serif; font-size: 1.15rem; font-weight: 600; }
.lang-level { font-size: 0.78rem; color: var(--accent); letter-spacing: 0.08em; }
.lang-bar-bg {
  height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
}
.lang-bar-fill {
  height: 100%; background: var(--accent); border-radius: 2px; width: 0;
  transition: width 1.2s cubic-bezier(0.22,1,0.36,1);
}

/* Education */
.edu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
.edu-card {
  background: var(--surface); border: 1px solid var(--border);
  padding: 2rem; border-radius: var(--radius); transition: border-color 0.3s;
}
.edu-card:hover { border-color: var(--accent); }
.edu-year { font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.75rem; }
.edu-title { font-family: 'Cormorant', serif; font-size: 1.1rem; font-weight: 600; margin-bottom: 0.3rem; }
.edu-institution { font-size: 0.85rem; color: var(--text-muted); }

/* Contact */
.contact-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: start; }
.contact-title {
  font-family: 'Cormorant', serif; font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 600; line-height: 1.1; margin-bottom: 1.5rem;
}
.contact-title em { font-style: italic; color: var(--accent); }
.contact-text { color: var(--text-soft); font-size: 0.95rem; margin-bottom: 2rem; }
.contact-links { display: flex; flex-direction: column; gap: 1rem; }
.contact-link {
  display: flex; align-items: center; gap: 0.75rem;
  color: var(--text-soft); text-decoration: none; font-size: 0.9rem;
  transition: color 0.2s; padding: 0.5rem 0; border-bottom: 1px solid var(--border);
}
.contact-link:hover { color: var(--accent); }
.contact-link svg { color: var(--accent); flex-shrink: 0; }

/* Footer */
footer {
  padding: 2rem; text-align: center; border-top: 1px solid var(--border);
  color: var(--text-muted); font-size: 0.78rem; letter-spacing: 0.05em;
}

/* Testimonials */
.testimonials-track-wrapper {
  overflow: hidden;
  position: relative;
  margin: 0 -2rem;
  padding: 1rem 0 2rem;
}
.testimonials-track-wrapper::before,
.testimonials-track-wrapper::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 120px;
  z-index: 2;
  pointer-events: none;
}
.testimonials-track-wrapper::before {
  left: 0;
  background: linear-gradient(to right, var(--bg), transparent);
}
.testimonials-track-wrapper::after {
  right: 0;
  background: linear-gradient(to left, var(--bg), transparent);
}
.testimonials-track {
  display: flex;
  gap: 1.5rem;
  width: max-content;
  animation: scrollTrack 40s linear infinite;
}
.testimonials-track:hover {
  animation-play-state: paused;
}
@keyframes scrollTrack {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.testimonial-card {
  width: 320px;
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1.75rem;
  transition: border-color 0.3s, transform 0.3s;
  position: relative;
}
.testimonial-card:hover {
  border-color: var(--accent);
  transform: translateY(-4px);
}
.testimonial-quote {
  font-size: 2.5rem;
  line-height: 1;
  color: var(--accent);
  opacity: 0.35;
  font-family: 'Cormorant', serif;
  margin-bottom: 0.25rem;
}
.testimonial-text {
  font-size: 0.88rem;
  color: var(--text-soft);
  line-height: 1.8;
  margin-bottom: 1.5rem;
  font-style: italic;
}
.testimonial-author {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}
.testimonial-name {
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--text);
  letter-spacing: 0.02em;
}
.testimonial-role {
  font-size: 0.75rem;
  color: var(--accent);
  letter-spacing: 0.05em;
}
.testimonial-date {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 0.1rem;
}

/* Responsive */
@media (max-width: 768px) {
  .hero-inner { grid-template-columns: 1fr; }
  .hero-photo-wrap { display: none; }
  .about-grid { grid-template-columns: 1fr; gap: 2.5rem; }
  .contact-inner { grid-template-columns: 1fr; gap: 2.5rem; }
  nav { padding: 1.25rem 1rem; gap: 1rem; }
  .nav-links { gap: 1rem; }
  .nav-links a { font-size: 0.68rem; }
}
@media (pointer: coarse) {
  body, .btn-primary, .btn-secondary, .lang-switch { cursor: auto; }
  .cursor, .cursor-ring { display: none; }
}
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
  <a href="#inicio" class="nav-logo"></a>
  <ul class="nav-links" id="navLinks"></ul>
  <button class="lang-switch lang-es" id="langSwitch" aria-label="Switch language">
    <span class="lang-option">ES</span>
    <span class="lang-slider"></span>
    <span class="lang-option">EN</span>
  </button>
</nav>

<main>
  <section class="hero" id="inicio">
    <div class="hero-inner">
      <div>
        <div class="hero-tag" id="heroTag"></div>
        <h1 id="heroName">Abel Aníbal Cáceres</h1>
        <p class="hero-desc" id="heroDesc"></p>
        <div class="hero-ctas">
          <a href="#contacto" class="btn-primary" id="heroCta1"></a>
          <a href="https://www.linkedin.com/in/abelanibalcaceres" target="_blank" rel="noreferrer" class="btn-secondary" id="heroCta2"></a>
        </div>
      </div>
      <div class="hero-photo-wrap">
        <img src="yo.jpeg" alt="Abel Aníbal Cáceres" class="hero-photo" />
      </div>
    </div>
  </section>

  <section id="mision">
    <div class="container">
      <div class="section-label fade-in" id="labelMission"></div>
      <p class="mission-lead fade-in" id="missionLead"></p>
      <div class="mission-body fade-in" id="missionBody"></div>
    </div>
  </section>

  <section id="sobre-mi">
    <div class="container">
      <div class="section-label fade-in" id="labelAbout"></div>
      <div class="about-grid">
        <div class="about-text fade-in" id="aboutText"></div>
        <div class="about-stats" id="aboutStats"></div>
      </div>
    </div>
  </section>

  <section id="experiencia">
    <div class="container">
      <div class="section-label fade-in" id="labelExp"></div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section id="casos-exito">
    <div class="container">
      <div class="section-label fade-in" id="labelCases"></div>
      <div class="case-studies" id="caseStudies"></div>
    </div>
  </section>

// ─── CURSOR PERSONALIZADO ───────────────────────────────────────────────────
(function initCursor() {
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  window.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    setTimeout(() => {
      ring.style.left = e.clientX + 'px';
      ring.style.top = e.clientY + 'px';
    }, 80);
  });
})();

// ─── FADE-IN AL HACER SCROLL ────────────────────────────────────────────────
let fadeObserver;
function initFadeIns() {
  if (fadeObserver) fadeObserver.disconnect();
  fadeObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1, rootMargin: '-60px' });
  document.querySelectorAll('.fade-in').forEach((el, i) => {
    el.style.transitionDelay = (i % 6) * 0.08 + 's';
    fadeObserver.observe(el);
  });
}
