/* Graphic 1: maturity ladder */
.maturity-ladder { position: relative; padding: 0.5rem 0 0.5rem; }
.ladder-track { position: absolute; top: 22px; left: 12%; right: 12%; height: 2px; background: var(--border); z-index: 0; }
.ladder-track-fill { height: 100%; width: 0; background: var(--accent); transition: width 1.8s cubic-bezier(0.22,1,0.36,1) 0.2s; }
.maturity-ladder.visible .ladder-track-fill { width: 100%; }
.ladder-steps { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
.ladder-step {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.7rem;
  opacity: 0; transform: translateY(14px);
  transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22,1,0.36,1);
}
.ladder-step:nth-child(1) { transition-delay: 0.35s; }
.ladder-step:nth-child(2) { transition-delay: 0.55s; }
.ladder-step:nth-child(3) { transition-delay: 0.75s; }
.ladder-step:nth-child(4) { transition-delay: 0.95s; }
.maturity-ladder.visible .ladder-step { opacity: 1; transform: translateY(0); }
.ladder-dot {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant', serif; font-size: 1.2rem; font-weight: 600; color: var(--accent);
  position: relative;
}
.ladder-dot::after {
  content: ''; position: absolute; inset: -6px; border-radius: 50%;
  border: 1px solid var(--accent); opacity: 0;
}
.maturity-ladder.visible .ladder-step:nth-child(1) .ladder-dot::after { animation: pulseRing 2.6s ease-out 1.1s infinite; }
.maturity-ladder.visible .ladder-step:nth-child(2) .ladder-dot::after { animation: pulseRing 2.6s ease-out 1.3s infinite; }
.maturity-ladder.visible .ladder-step:nth-child(3) .ladder-dot::after { animation: pulseRing 2.6s ease-out 1.5s infinite; }
.maturity-ladder.visible .ladder-step:nth-child(4) .ladder-dot::after { animation: pulseRing 2.6s ease-out 1.7s infinite; }
@keyframes pulseRing {
  0% { transform: scale(0.8); opacity: 0.7; }
  100% { transform: scale(1.6); opacity: 0; }
}
.ladder-label { font-size: 0.86rem; font-weight: 500; color: var(--text); letter-spacing: 0.02em; }

@media (max-width: 640px) {

<script>
// ─── Gráfico 1: escalera de madurez ─────────────────────────────────────────
const LADDER = {
  es: [
    { n: 1, label: "Observar", desc: "Exploración individual, sin integrarse al flujo oficial" },
    { n: 2, label: "Asistir", desc: "Sugiere en el IDE y los PRs, decide el humano" },
    { n: 3, label: "Co-crear", desc: "Genera borradores bajo especificación humana clara" },
    { n: 4, label: "Delegar con supervisión", desc: "Tareas acotadas, revisión humana obligatoria antes de merge" },
  ],
  en: [
    { n: 1, label: "Observe", desc: "Individual exploration, kept outside the official workflow" },
    { n: 2, label: "Assist", desc: "Suggests inside the IDE and PRs, humans decide" },
    { n: 3, label: "Co-create", desc: "Drafts code from clear human specs, pair-programmed" },
    { n: 4, label: "Delegate with oversight", desc: "Narrow, low-risk tasks, mandatory human review before merge" },
  ],
};

// ─── Gráfico 2: autonomía de IA vs control humano por fase ──────────────────
const AUTONOMY = {
  es: [
    { phase: "Fase 1 · Observar", pct: 15, split: "15% IA · 85% control humano directo" },
    { phase: "Fase 2 · Asistir", pct: 35, split: "35% IA · 65% control humano directo" },
    { phase: "Fase 3 · Co-crear", pct: 55, split: "55% IA · 45% control humano directo" },
    { phase: "Fase 4 · Delegar con supervisión", pct: 70, split: "70% IA · 30% control humano directo" },
  ],
  en: [
    { phase: "Phase 1 · Observe", pct: 15, split: "15% AI · 85% direct human control" },
    { phase: "Phase 2 · Assist", pct: 35, split: "35% AI · 65% direct human control" },
    { phase: "Phase 3 · Co-create", pct: 55, split: "55% AI · 45% direct human control" },
    { phase: "Phase 4 · Delegate with oversight", pct: 70, split: "70% AI · 30% direct human control" },
  ],
};

function ladderHTML(lang) {
  return `
  <div class="graphic-card">
    <div class="graphic-title">${lang === 'es' ? 'Camino de madurez de adopción' : 'Adoption maturity path'}</div>
    <div class="maturity-ladder" id="maturityLadder">
      <div class="ladder-track"><div class="ladder-track-fill"></div></div>
      <div class="ladder-steps">
        ${LADDER[lang].map(s => `
          <div class="ladder-step">
            <div class="ladder-dot">${s.n}</div>
            <div class="ladder-label">${s.label}</div>
            <div class="ladder-desc">${s.desc}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function autonomyHTML(lang) {
  return `
  <div class="graphic-card">
    <div class="graphic-title">${lang === 'es' ? 'Autonomía delegada a la IA, por fase' : 'Autonomy delegated to AI, by phase'}</div>
    <div class="autonomy-chart" id="autonomyChart">
      ${AUTONOMY[lang].map(a => `
        <div class="autonomy-row">
          <div class="autonomy-row-head">
            <span class="autonomy-phase">${a.phase}</span>
            <span class="autonomy-split">${a.split}</span>
          </div>
          <div class="autonomy-bar-bg"><div class="autonomy-bar-fill" data-pct="${a.pct}"></div></div>
        </div>`).join('')}
    </div>
    <p class="graphic-caption">${lang === 'es'
      ? 'El control humano nunca llega a cero: incluso en la fase de delegación supervisada, ningún cambio llega a producción sin revisión y aprobación humana explícita.'
      : "Human control never reaches zero: even in the delegate-with-oversight phase, no change reaches production without explicit human review and approval."}</p>
  </div>`;
}

// ─── Contenido bilingüe ──────────────────────────────────────────────────────
const CONTENT = {
  es: {
    backLabel: "Volver al portfolio",
    tag: "Liderazgo Técnico · IA",
    title: "IA en el equipo: cómo un CTO puede avanzar sin soltar el control",
    lead: "Ni delegar todo el desarrollo a un modelo, ni fingir que la IA no está cambiando cómo escribimos software. El trabajo real de un CTO hoy es diseñar el ritmo de adopción — y el punto exacto donde el criterio humano no se negocia.",
    author: "Abel Aníbal Cáceres",
    role: "CTO",
    date: "5 de septiembre de 2026",
    readTime: "6 min de lectura",
    ctaTitle: "¿Estás encarando esta misma discusión en tu equipo?",
    ctaText: "Si querés comparar notas sobre adopción de IA, gobierno técnico o infraestructura crítica, escribime.",
    ctaBtn: "Hablemos",
    footerText: "Abel Aníbal Cáceres — La Falda, Córdoba, Argentina",
    body: [
      { h2: "El falso dilema" },
      { p: "Para muchos CTOs, la conversación sobre IA generativa en el equipo de ingeniería quedó atrapada entre dos extremos igual de riesgosos. Uno es el entusiasmo sin freno: dejar que los agentes generen features completas, revisar poco y confiar en que \"ya va a mejorar\" con la próxima versión del modelo. El otro es la resistencia: tratar a la IA como una moda, prohibirla o simplemente ignorarla mientras el resto de la industria acelera. Ambos comparten el mismo error de base — tratan la adopción de IA como una decisión binaria, cuando en realidad es un proceso de maduración organizacional que se gestiona por etapas, con métricas propias y con salidas de emergencia bien definidas." },
      { p: "Después de liderar equipos de infraestructura crítica en banca y salud, mi conclusión es simple: la pregunta correcta no es <strong>\"¿usamos IA o no?\"</strong>, sino <strong>\"¿en qué fase estamos, y qué control humano no estamos dispuestos a ceder en ninguna fase?\"</strong>" },

      { h2: "El costo de delegar todo" },
      { p: "Cuando un equipo delega el desarrollo casi por completo a la IA, los primeros síntomas no se ven en el código — se ven en las personas. La revisión de pull requests se vuelve un trámite: \"el CI pasó, la IA lo escribió bien, aprobado\". Los desarrolladores junior dejan de ejercitar el músculo de depurar un problema desde cero, porque siempre hay un asistente que propone una solución antes de que terminen de entender el síntoma. Y en infraestructura crítica —la que sostiene transacciones financieras o la atención de pacientes— esto es particularmente peligroso: el conocimiento sobre por qué se tomó una decisión de arquitectura empieza a vivir en un historial de prompts, no en la cabeza ni en la documentación del equipo que tiene que responder cuando algo falla a las tres de la mañana." },

      { h2: "El costo de ignorarla" },
      { p: "El extremo opuesto tiene un costo distinto, pero igual de real. Los equipos que prohíben o desalientan el uso de IA generativa terminan compitiendo en desventaja: tareas repetitivas que un asistente resuelve en minutos —boilerplate, migraciones de sintaxis, primeras versiones de tests— se siguen haciendo a mano, y el talento senior termina invirtiendo su tiempo más valioso en trabajo que ya no debería insumir horas. Además, ignorar la IA no la vuelve irrelevante para el negocio: los equipos de seguridad, observabilidad y soporte de la industria ya la están incorporando, y un CTO que se queda al margen pierde la posibilidad de moldear cómo se adopta, antes de que la adopción ocurra igual, sin gobierno." },

      { h2: "Un camino gradual: cuatro fases, no un interruptor" },
      { p: "La alternativa a ambos extremos es tratar la adopción de IA como cualquier otra capacidad organizacional nueva: con un camino de madurez explícito, medido y reversible." },
      { graphic: "ladder" },
      { p: "Ninguna organización tiene que atravesar las cuatro fases a la misma velocidad en todos sus equipos. Un equipo de plataforma que sostiene pagos puede estar en Fase 2 mientras un equipo de herramientas internas ya opera en Fase 4 — y eso es correcto, no una inconsistencia a corregir." },

      { h2: "Lo que no negocio en ninguna fase" },
      { p: "Por más avanzada que esté la adopción, hay líneas que en mi experiencia no se cruzan en infraestructura crítica:" },
      { graphic: "autonomy" },
      { ul: [

// ─── Cursor ──────────────────────────────────────────────────────────────
(function initCursor() {
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  window.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    setTimeout(() => {
      ring.style.left = e.clientX + 'px';
      ring.style.top = e.clientY + 'px';
    }, 80);
  });
})();

// ─── Fade-in on scroll ───────────────────────────────────────────────────
let fadeObserver, graphicObserver;
function initObservers() {
  if (fadeObserver) fadeObserver.disconnect();
  fadeObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1, rootMargin: '-60px' });
  document.querySelectorAll('.fade-in').forEach((el, i) => {
    el.style.transitionDelay = (i % 6) * 0.08 + 's';
    fadeObserver.observe(el);
  });

  if (graphicObserver) graphicObserver.disconnect();
  graphicObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        entry.target.querySelectorAll('[data-pct]').forEach(el => {
          el.style.width = el.dataset.pct + '%';
        });
        graphicObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.3 });
  document.getElementById('maturityLadder') && graphicObserver.observe(document.getElementById('maturityLadder'));
  document.getElementById('autonomyChart') && graphicObserver.observe(document.getElementById('autonomyChart'));
}

// ─── Render ──────────────────────────────────────────────────────────────
let lang = 'es';

function renderBody(t) {
  return t.body.map(block => {
    if (block.h2) return `<div class="fade-in"><h2>${block.h2}</h2></div>`;
    if (block.p) return `<p class="fade-in">${block.p}</p>`;
    if (block.ul) return `<ul class="fade-in">${block.ul.map(li => `<li>${li}</li>`).join('')}</ul>`;
    if (block.ol) return `<ol class="fade-in">${block.ol.map(li => `<li>${li}</li>`).join('')}</ol>`;
    if (block.graphic === 'ladder') return ladderHTML(lang);
    if (block.graphic === 'autonomy') return autonomyHTML(lang);
    return '';
  }).join('');
}

function render() {
  const t = CONTENT[lang];
  document.documentElement.lang = lang;

  document.getElementById('backLabel').textContent = t.backLabel;
  document.getElementById('articleTag').textContent = t.tag;
  document.getElementById('articleTitle').textContent = t.title;
  document.getElementById('articleLead').textContent = t.lead;
  document.getElementById('articleMeta').innerHTML = `
    <span><strong>${t.author}</strong> · ${t.role}</span>
    <span>${t.date}</span>
    <span>${t.readTime}</span>
  `;

  document.getElementById('articleBody').innerHTML = renderBody(t);

  document.getElementById('ctaTitle').textContent = t.ctaTitle;
  document.getElementById('ctaText').textContent = t.ctaText;
  const ctaBtn = document.getElementById('ctaBtn');
  ctaBtn.textContent = t.ctaBtn;
  ctaBtn.href = '../index.html#contacto';

  document.getElementById('footerText').textContent = `© ${new Date().getFullYear()} ${t.footerText}`;

  initObservers();
}

document.getElementById('langSwitch').addEventListener('click', () => {
  lang = lang === 'es' ? 'en' : 'es';
  const btn = document.getElementById('langSwitch');
  btn.classList.toggle('lang-es', lang === 'es');
  btn.classList.toggle('lang-en', lang === 'en');
  render();
});

render();
</script>
