.ladder-step {

.maturity-ladder.visible .ladder-step { opacity: 1; transform: translateY(0); }
.ladder-dot {
  width: 54px; height: 44px; border-radius: 10px;
  background: var(--bg); border: 2px solid var(--accent);

}
.ladder-dot::after {
  content: ''; position: absolute; inset: -6px; border-radius: 12px;
  border: 1px solid var(--accent); opacity: 0;
}
.maturity-ladder.visible .ladder-step:nth-child(1) .ladder-dot::after { animation: pulseRing 2.6s ease-out 1.1s infinite; }
.maturity-ladder.visible .ladder-step:nth-child(2) .ladder-dot::after { animation: pulseRing 2.6s ease-out 1.3s infinite; }
.maturity-ladder.visible .ladder-step:nth-child(3) .ladder-dot::after { animation: pulseRing 2.6s ease-out 1.5s infinite; }
.maturity-ladder.visible .ladder-step:nth-child(4) .ladder-dot::after { animation: pulseRing 2.6s ease-out 1.7s infinite; }
@keyframes pulseRing {

<script>
// ─── Gráfico 1: el péndulo, en cuatro momentos ──────────────────────────────
const TIMELINE = {
  es: [
    { n: "2006", label: "Nace la nube", desc: "AWS lanza S3 y EC2. La elasticidad bajo demanda reemplaza la compra de hardware." },
    { n: "2011–13", label: "Mandato cloud-first", desc: "EE. UU. (2011) y el Reino Unido (2013) convierten la migración a la nube en política de estado." },
    { n: "2020–21", label: "El despertar del costo", desc: "El fallo Schrems II y el ensayo \"Cost of Cloud\" de a16z exponen soberanía de datos y costo oculto." },
    { n: "2022–26", label: "Repatriación selectiva", desc: "Las cargas más críticas vuelven a infraestructura propia o nube privada, bajo control y seguridad." },
  ],
  en: [
    { n: "2006", label: "The cloud is born", desc: "AWS launches S3 and EC2. On-demand elasticity replaces buying hardware outright." },
    { n: "2011–13", label: "Cloud-first mandates", desc: "The US (2011) and the UK (2013) turn cloud migration into official government policy." },
    { n: "2020–21", label: "The cost reckoning", desc: "The Schrems II ruling and a16z's \"Cost of Cloud\" essay expose data sovereignty and hidden cost." },
    { n: "2022–26", label: "Selective repatriation", desc: "The most critical workloads return to owned infrastructure or private cloud, for control and security." },
  ],
};

// ─── Gráfico 2: dónde vive cada carga, según criticidad ─────────────────────
const CRITICALITY = {
  es: [
    { phase: "Colaboración y datos no sensibles", pct: 90, split: "90% nube pública · 10% otro" },
    { phase: "Aplicaciones internas estándar", pct: 60, split: "60% nube pública · 40% híbrido" },
    { phase: "Datos regulados (salud, finanzas, justicia)", pct: 30, split: "30% nube pública · 70% on-premise o nube privada" },
    { phase: "Misión crítica (pagos, historias clínicas, sistemas judiciales)", pct: 10, split: "10% nube pública · 90% on-premise o nube privada controlada" },
  ],
  en: [
    { phase: "Collaboration and non-sensitive data", pct: 90, split: "90% public cloud · 10% other" },
    { phase: "Standard internal applications", pct: 60, split: "60% public cloud · 40% hybrid" },
    { phase: "Regulated data (healthcare, finance, justice)", pct: 30, split: "30% public cloud · 70% on-premise or private cloud" },
    { phase: "Mission-critical (payments, health records, judicial systems)", pct: 10, split: "10% public cloud · 90% on-premise or controlled private cloud" },
  ],
};

function timelineHTML(lang) {
  return `
  <div class="graphic-card">
    <div class="graphic-title">${lang === 'es' ? 'El péndulo de la infraestructura, en cuatro momentos' : "Infrastructure's pendulum, in four moments"}</div>
    <div class="maturity-ladder" id="maturityLadder">
      <div class="ladder-track"><div class="ladder-track-fill"></div></div>
      <div class="ladder-steps">
        ${TIMELINE[lang].map(s => `
          <div class="ladder-step">
            <div class="ladder-dot">${s.n}</div>
            <div class="ladder-label">${s.label}</div>
            <div class="ladder-desc">${s.desc}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function criticalityHTML(lang) {
  return `
  <div class="graphic-card">
    <div class="graphic-title">${lang === 'es' ? 'Dónde vive cada carga de trabajo, según su criticidad' : 'Where each workload lives, by criticality'}</div>
    <div class="autonomy-chart" id="autonomyChart">
      ${CRITICALITY[lang].map(a => `
        <div class="autonomy-row">
          <div class="autonomy-row-head">
            <span class="autonomy-phase">${a.phase}</span>
            <span class="autonomy-split">${a.split}</span>
          </div>
          <div class="autonomy-bar-bg"><div class="autonomy-bar-fill" data-pct="${a.pct}"></div></div>
        </div>`).join('')}
    </div>
    <p class="graphic-caption">${lang === 'es'
      ? 'Es un marco orientativo, no una encuesta de la industria. La proporción exacta varía según el sector, pero el principio se mantiene: a mayor criticidad y regulación, menor exposición a la nube pública.'
      : "It's an illustrative framework, not an industry survey. The exact split varies by sector, but the principle holds: the more critical and regulated the data, the less exposure to public cloud."}</p>
  </div>`;
}

// ─── Contenido bilingüe ──────────────────────────────────────────────────────
const CONTENT = {
  es: {
    backLabel: "Volver al portfolio",
    tag: "Infraestructura Crítica · Cloud",
    title: "El péndulo vuelve: por qué la infraestructura crítica regresa al on-premise",
    lead: "La fiebre de \"todo a la nube\" tuvo su pico hace más de una década. Hoy la misma industria que empujó esa migración está trayendo de vuelta sus cargas más críticas al centro de datos propio — y la IA, treinta años más joven, probablemente recorra el mismo camino.",
    author: "Abel Aníbal Cáceres",
    role: "CTO",
    date: "5 de octubre de 2026",
    readTime: "8 min de lectura",
    ctaTitle: "¿Estás repensando dónde vive tu infraestructura crítica?",
    ctaText: "Si querés comparar notas sobre repatriación de cargas, soberanía de datos o gobierno de IA, escribime.",
    ctaBtn: "Hablemos",
    footerText: "Abel Aníbal Cáceres — La Falda, Córdoba, Argentina",
    body: [
      { h2: "La fiebre que vivimos" },
      { p: "Entre 2006, cuando Amazon lanzó S3 y EC2, y 2015, la industria atravesó una fiebre de adopción casi religiosa. Estados Unidos institucionalizó la política \"Cloud First\" en 2011 y el Reino Unido hizo lo propio en 2013: de un día para el otro, mover cargas de trabajo a la nube pública dejó de ser una decisión técnica para convertirse en mandato de gobierno y señal de modernidad corporativa. \"Cloud-first\", \"all-in on the cloud\" y \"lift and shift\" se volvieron mantras de comité ejecutivo. Quien no migraba quedaba, según el discurso dominante, condenado a la obsolescencia." },
      { p: "Quince años después, la misma industria que empujó esa migración está escribiendo el capítulo inverso." },

      { h2: "El costo de migrar todo sin criterio" },
      { p: "En mayo de 2021, los inversores Sarah Wang y Martin Casado, de Andreessen Horowitz, publicaron <strong>\"The Cost of Cloud, a Trillion Dollar Paradox\"</strong>, un ensayo que cuantificó algo que muchos equipos de infraestructura ya sospechaban: a cierta escala, el costo de la nube pública deja de ser una ventaja competitiva y se convierte en un lastre sobre el margen operativo. Un año y medio más tarde, en octubre de 2022, David Heinemeier Hansson —fundador de 37signals (Basecamp, HEY)— anunció públicamente que la compañía abandonaría la nube por completo y volvería a hardware propio. Los balances que la empresa publicó después mostraron ahorros multimillonarios sostenidos año tras año: no una anécdota aislada, sino la validación pública de que el péndulo ya se había movido demasiado lejos." },
      { p: "A esto se sumó una dimensión que el análisis puramente financiero no capturaba: la soberanía de datos. En julio de 2020, el Tribunal de Justicia de la Unión Europea invalidó el acuerdo \"Privacy Shield\" entre la UE y Estados Unidos (el fallo conocido como <strong>Schrems II</strong>), dejando en una zona gris legal a cualquier organización europea que almacenara datos regulados en infraestructura de un proveedor estadounidense. De la noche a la mañana, bancos, aseguradoras y hospitales de todo el mundo empezaron a hacerse la misma pregunta que antes solo se hacían los más conservadores: ¿quién puede acceder legalmente a nuestros datos más sensibles, y bajo qué jurisdicción?" },

// ─── Cursor ──────────────────────────────────────────────────────────────
(function initCursor() {
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  window.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    setTimeout(() => {
      ring.style.left = e.clientX + 'px';
      ring.style.top = e.clientY + 'px';
    }, 80);
  });
})();

// ─── Fade-in on scroll ───────────────────────────────────────────────────
let fadeObserver, graphicObserver;
function initObservers() {
  if (fadeObserver) fadeObserver.disconnect();
  fadeObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1, rootMargin: '-60px' });
  document.querySelectorAll('.fade-in').forEach((el, i) => {
    el.style.transitionDelay = (i % 6) * 0.08 + 's';
    fadeObserver.observe(el);
  });

  if (graphicObserver) graphicObserver.disconnect();
  graphicObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        entry.target.querySelectorAll('[data-pct]').forEach(el => {
          el.style.width = el.dataset.pct + '%';
        });
        graphicObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.3 });
  document.getElementById('maturityLadder') && graphicObserver.observe(document.getElementById('maturityLadder'));
  document.getElementById('autonomyChart') && graphicObserver.observe(document.getElementById('autonomyChart'));
}

// ─── Render ──────────────────────────────────────────────────────────────
let lang = 'es';

function renderBody(t) {
  return t.body.map(block => {
    if (block.h2) return `<div class="fade-in"><h2>${block.h2}</h2></div>`;
    if (block.p) return `<p class="fade-in">${block.p}</p>`;
    if (block.ul) return `<ul class="fade-in">${block.ul.map(li => `<li>${li}</li>`).join('')}</ul>`;
    if (block.ol) return `<ol class="fade-in">${block.ol.map(li => `<li>${li}</li>`).join('')}</ol>`;
    if (block.graphic === 'timeline') return timelineHTML(lang);
    if (block.graphic === 'criticality') return criticalityHTML(lang);
    return '';
  }).join('');
}

function render() {
  const t = CONTENT[lang];
  document.documentElement.lang = lang;

  document.getElementById('backLabel').textContent = t.backLabel;
  document.getElementById('articleTag').textContent = t.tag;
  document.getElementById('articleTitle').textContent = t.title;
  document.getElementById('articleLead').textContent = t.lead;
  document.getElementById('articleMeta').innerHTML = `
    <span><strong>${t.author}</strong> · ${t.role}</span>
    <span>${t.date}</span>
    <span>${t.readTime}</span>
  `;

  document.getElementById('articleBody').innerHTML = renderBody(t);

  ctaBtn.href = '../index.html#contacto';

  document.getElementById('footerText').textContent = `© ${new Date().getFullYear()} ${t.footerText}`;

  initObservers();
}

});
