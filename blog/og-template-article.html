<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0d0d0d;
    color: #f0ece4;
    font-family: 'DM Sans', sans-serif;
  }
  .card {
    position: relative;
    width: 1200px; height: 630px;
    padding: 66px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
  }
  .glow {
    position: absolute; top: -180px; right: -160px;
    width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(201,168,76,0.16) 0%, transparent 70%);
  }
  .motif {
    position: absolute; top: 64px; right: 84px;
    display: flex; align-items: center; gap: 22px;
    opacity: 0.5;
  }
  .motif .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #c9a84c; background: #0d0d0d; }
  .motif .bar { width: 24px; height: 2px; background: #2a2a2a; }
  .top { position: relative; z-index: 1; }
  .kicker {
    font-size: 19px; letter-spacing: 0.25em; text-transform: uppercase;
    color: #c9a84c; display: flex; align-items: center; gap: 14px;
    margin-bottom: 36px;
  }
  .kicker::before { content: ''; width: 46px; height: 2px; background: #c9a84c; }
  h1 {
    font-family: 'Cormorant', serif; font-weight: 600;
    font-size: 56px; line-height: 1.18; letter-spacing: 0.005em;
    max-width: 980px;
  }
  .bottom {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 20px;
    padding-top: 30px; border-top: 1px solid #2a2a2a;
  }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    object-fit: cover; filter: grayscale(15%);
    border: 2px solid #c9a84c;
  }
  .author { display: flex; flex-direction: column; gap: 4px; }
  .name { font-family: 'Cormorant', serif; font-size: 24px; font-weight: 600; color: #f0ece4; }
  .role { font-size: 15px; color: #7a7570; letter-spacing: 0.03em; }
  .domain { margin-left: auto; font-size: 15px; color: #b8b0a4; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="motif">
      <div class="dot"></div><div class="bar"></div>
      <div class="dot"></div><div class="bar"></div>
      <div class="dot"></div><div class="bar"></div>
      <div class="dot"></div>
    </div>
    <div class="top">
      <div class="kicker">Blog · Liderazgo Técnico · IA</div>
      <h1>IA en el equipo: cómo un CTO puede avanzar sin soltar el control</h1>
    </div>
    <div class="bottom">
      <img class="avatar" src="../yo.jpeg" />
      <div class="author">
        <div class="name">Abel Aníbal Cáceres</div>
        <div class="role">CTO · Morph Analytics</div>
      </div>
      <div class="domain">abelanibalcaceres.site</div>
    </div>
  </div>
</body>
</html>
