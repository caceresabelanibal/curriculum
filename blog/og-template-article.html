<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0d0d0d;
    color: #f0ece4;
    font-family: 'DM Sans', sans-serif;
  }
  .card {
    position: relative;
    width: 1200px; height: 630px;
    display: flex; align-items: center;
    overflow: hidden;
  }
  .glow {
    position: absolute; top: -220px; right: -160px;
    width: 780px; height: 780px;
    background: radial-gradient(circle, rgba(201,168,76,0.18) 0%, transparent 70%);
  }
  .glow2 {
    position: absolute; bottom: -260px; left: -180px;
    width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
  }
  .row {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 56px;
    width: 100%; padding: 0 84px;
  }
  .avatar-wrap {
    width: 220px; height: 220px; border-radius: 50%; flex-shrink: 0;
    border: 5px solid #c9a84c; overflow: hidden;
    box-shadow: 0 0 60px rgba(201,168,76,0.25);
  }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(15%); }
  .text { display: flex; flex-direction: column; gap: 20px; max-width: 700px; }
  .kicker {
    font-size: 20px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
    color: #c9a84c; display: flex; align-items: center; gap: 14px;
  }
  .kicker::before { content: ''; width: 40px; height: 3px; background: #c9a84c; flex-shrink: 0; }
  h1 {
    font-weight: 700; font-size: 58px; line-height: 1.2; letter-spacing: -0.01em;
    color: #ffffff;
  }
  .domain {
    position: absolute; bottom: 46px; right: 84px; z-index: 1;
    font-size: 17px; font-weight: 500; color: #b8b0a4; letter-spacing: 0.08em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="row">
      <div class="avatar-wrap"><img src="../yo.jpeg" /></div>
      <div class="text">
        <div class="kicker">Blog · Liderazgo Técnico</div>
        <h1>IA en el equipo,<br/>con criterio humano</h1>
      </div>
    </div>
    <div class="domain">abelanibalcaceres.site</div>
  </div>
</body>
</html>
